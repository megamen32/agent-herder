[package]
name = "herder"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
publish = false

[[bin]]
name = "herder-wire-probe"
path = "src/main.rs"

[dependencies]
rmcp = { version = "=3.9.0", default-features = false, features = ["server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
tokio = { version = "1", features = ["macros", "rt"] }
