[package]
name = "herder"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
publish = false

[[bin]]
name = "herder-wire-probe"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
base64 = "0.22"
libc = "0.2"
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled", "functions"] }
rmcp = { version = "=3.9.0", default-features = false, features = ["server", "transport-io"] }
schemars = "1.2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
serde_path_to_error = "0.1"
tokio = { version = "1", features = ["macros", "rt", "time"] }

[dev-dependencies]
jsonschema = { version = "0.60.2", default-features = false }
