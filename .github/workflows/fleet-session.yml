name: Fleet session routing

on:
  push:
    paths:
      - 'src/**'
      - 'crates/**'
      - '.cargo/**'
      - 'Cargo.*'
      - 'packages/**'
      - 'integrations/chrome/**'
      - 'tests/**'
      - 'deploy/**'
      - 'scripts/**'
      - '.github/workflows/fleet-session.yml'
      - 'package*.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - 'vitest.config.ts'
  pull_request:
  workflow_dispatch:
    inputs:
      installed_source_sha:
        description: 'Optional installed runtime commit; only a main ancestor with no runtime/UI/CI source changes is accepted'
        required: false
        type: string

permissions:
  contents: read

jobs:
  routing:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # The lockfile pins a public Git dependency using an SSH URL; hosted
      # runners have no SSH identity, so fetch that public dependency over HTTPS.
      - run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - run: npm ci
      - run: npm run build:core
      - name: Typecheck Agent Herder source and tests
        run: npx tsc --noEmit --pretty false
      - name: Verify fleet creation, routing, and owner admission
        run: npx vitest run --root . --config vitest.config.ts tests/mcp-host-default.test.ts tests/fleet-session-consumer-integration.test.ts tests/fleet-node-harness-routing.test.ts tests/harness-mesh-fleet-api.test.ts tests/harness-mesh-fleet-direct.test.ts tests/project-model-gate-tools.test.ts tests/zai-cdp-driver.test.ts tests/zai-queue-delivery.test.ts tests/browser-chat-create.test.ts
      - name: Verify peer transport, owner authentication, and process generation
        run: npx vitest run --root . --config vitest.config.ts tests/harness-mesh-fleet-owner-http-transport.test.ts tests/harness-mesh-fleet-transport.test.ts tests/harness-mesh-fleet-node-generation.test.ts
      - name: Verify Rust-first cross-host fake OpenCode delivery
        run: npx vitest run --root . --config vitest.config.ts tests/harness-mesh-cross-host-opencode.test.ts tests/harness-mesh-exact-route.test.ts tests/harness-mesh-remote-notes.test.ts tests/remote-workspaces.test.ts
      - name: Verify portable native configuration and V1 release report gate
        run: |
          python3 -m unittest discover -s tests/native -p test_runner_config.py
          python3 -m unittest discover -s tests/native -p test_candidate_release_gate.py

      - name: Verify installed browser collector, helper and rendered identity
        run: |
          npx vitest run --root . --config vitest.config.ts tests/installed-browser-smoke.test.ts tests/installed-browser-bindings.test.ts tests/installed-codex-proof.test.ts tests/installed-zcode-proof.test.ts tests/installed-owned-cleanup.test.ts tests/installed-native-worker.test.ts tests/ahap-zcode-model-pin.test.ts tests/session-sidebar.test.tsx tests/session-detail-identity.test.ts
          python3 -m unittest discover -s tests/native -p test_installed_smoke_helper.py
          python3 -m unittest discover -s tests/native -p test_installed_smoke_provision.py
          node --test tests/native/ci-browser-fixture.test.mjs

  native-recovery:
    name: Native Codex and OpenCode recovery with a fake model
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the Linux fixture tools and pinned harness binaries
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap iproute2 python3-websocket
          # Ubuntu's hosted image may restrict unprivileged network namespaces.
          # The fixtures require a new namespace containing only loopback.
          if ! unshare --user --map-root-user --net -- true; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          npm install --prefix "$RUNNER_TEMP/herder-recovery-cli" --ignore-scripts --no-save --no-audit --no-fund \
            'codex-native@npm:@openai/codex@0.170.0-linux-x64' '@opencode/cli-linux-x64@2.3.0' 'playwright-core@1.61.1'
      - name: Build the Rust owner
        run: |
          cargo build --locked --manifest-path crates/herder/Cargo.toml \
            --target-dir "$RUNNER_TEMP/herder-recovery-core" --bin herder_native_stdio --bin herder-browser
      - name: Verify Codex recovery after 429, fallback and restart
        shell: bash
        run: |
          codex_bin="$RUNNER_TEMP/herder-recovery-cli/node_modules/codex-native/vendor/x86_64-unknown-linux-musl/bin/codex"
          owner_bin="$RUNNER_TEMP/herder-recovery-core/debug/herder_native_stdio"
          /usr/bin/python3 -uB tests/native/codex_recovery_stand.py --codex "$codex_bin" --owner "$owner_bin" --same-route-429
          /usr/bin/python3 -uB tests/native/codex_recovery_stand.py --codex "$codex_bin" --owner "$owner_bin"
      - name: Verify OpenCode crash recovery and quota-bound fallback
        shell: bash
        run: |
          opencode_bin="$RUNNER_TEMP/herder-recovery-cli/node_modules/@opencode/cli-linux-x64/bin/opencode"
          owner_bin="$RUNNER_TEMP/herder-recovery-core/debug/herder_native_stdio"
          schema_dir="$PWD/crates/herder/src/store"
          /usr/bin/python3 -uB tests/native/launch.py --ro-bind "$owner_bin" --ro-bind "$schema_dir" -- \
            /usr/bin/python3 -uB "$PWD/tests/native/opencode_recovery_stand.py" \
            --opencode "$opencode_bin" --core "$owner_bin" --schema-dir "$schema_dir"
      - name: Verify browser delivery and ChatGPT recovery through the Herder extension
        shell: bash
        run: |
          cargo build --locked --manifest-path deploy/fleet/owner-bootstrap/Cargo.toml \
            --target-dir "$RUNNER_TEMP/herder-recovery-core"
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/herder-recovery-cli/node_modules/playwright-core/index.mjs"
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/herder-playwright-browsers"
          node "$RUNNER_TEMP/herder-recovery-cli/node_modules/playwright-core/cli.js" install chromium --no-shell
          node --test crates/herder/src/adapters/chatgpt/native.test.mjs
          for harness in chatgpt zai; do
            /usr/bin/python3 -uB tests/native/browser_adapter_smoke.py \
              --bin-dir "$RUNNER_TEMP/herder-recovery-core/debug" --extension \
              --harness "$harness" --surface mcp --content text --iterations 1 \
              --output "$RUNNER_TEMP/browser-delivery-$harness"
          done
          for scenario in success failed-retry lost-receipt lost-ack stale zai-refusal; do
            /usr/bin/python3 -uB tests/native/browser_adapter_smoke.py \
              --bin-dir "$RUNNER_TEMP/herder-recovery-core/debug" --extension --recovery "$scenario" \
              --output "$RUNNER_TEMP/browser-recovery-$scenario"
          done

  installed-browser:
    name: Installed Vibe functional smoke
    if: >-
      github.repository == 'megamen32/agent-herder' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: routing
    # This exact label is registered by provision-installed-smoke-runner.py.
    runs-on: [self-hosted, Linux, X64, agent-herder-installed-server100]
    timeout-minutes: 40
    concurrency:
      group: agent-herder-installed-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Run fixed installed runtime and Vibe collector
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import re
          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          requested = os.environ["GITHUB_SHA"]
          installed = event.get("inputs", {}).get("installed_source_sha") or requested
          if not isinstance(installed, str) or not re.fullmatch(r"[0-9a-f]{40}", installed):
              raise SystemExit("Invalid installed source SHA")
          paths = ["src", "packages", "tests", "deploy", "scripts", "crates", ".cargo", ":(glob)Cargo.*", ".github/workflows/fleet-session.yml",
                   ":(glob)package*.json", ":(glob)tsconfig*.json", "vite.config.ts", "vitest.config.ts"]
          subprocess.run(["git", "merge-base", "--is-ancestor", installed, requested], check=True)
          subprocess.run(["git", "diff", "--quiet", installed, requested, "--", *paths], check=True)
          request = {
              "run_id": "gha-" + os.environ["GITHUB_RUN_ID"] + "-" + os.environ["GITHUB_RUN_ATTEMPT"],
              "expected_source_sha": installed,
          }
          completed = subprocess.run(
              ["sudo", "-n", "-u", "roomhacker", "/usr/local/libexec/agent-herder-ci-smoke"],
              input=json.dumps(request), text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
              timeout=2100, check=False,
          )
          # The fixed helper emits status/check codes only. Raw browser/native
          # evidence and credentials remain in its protected host run directory.
          try:
              summary = json.loads(completed.stdout)
          except ValueError:
              summary = {"mode": "installed-browser", "status": "FAIL", "error_code": "helper_output_invalid"}
          summary.update(requested_commit_sha=requested, runtime_source_sha=installed, source_tree_equivalent=True)
          Path("installed-browser-summary.json").write_text(json.dumps(summary, indent=2) + "\n")
          print(json.dumps(summary, sort_keys=True))
          sys.exit(0 if completed.returncode == 0 and summary.get("status") == "PASS" else 1)
          PY
      - name: Keep sanitized installed smoke summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-browser-summary
          path: installed-browser-summary.json
          if-no-files-found: error
          retention-days: 14
