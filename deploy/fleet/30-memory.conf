# Fleet node memory budget for systemd-oomd.
#
# L44 (2026-10-24): the previous budget (MemoryHigh=384M, MemoryMax=768M) was
# below the measured working set of the node (memory.current peaked at
# 433020928 B). The unit therefore throttled against its own memory.high:
# cgroup memory.events high counter grew 15138 -> 39807 in two minutes. That
# reclaim activity inside scope user@1000.service is what systemd-oomd used as
# a kill trigger, and the unit was killed with SIGKILL 9 (code=killed,
# status=9/KILL, Failed with result signal) four times in one day.
#
# A finite MemoryHigh also makes the unit the best-scoring victim for
# systemd-oomd inside the scope (score = usage / memory.high), because every
# other unit in that scope has memory.high=infinity.
#
# Host 88 has ~83 GiB available and swap 0, so the raised bound is safe.
[Service]
MemoryHigh=1G
MemoryMax=2G
