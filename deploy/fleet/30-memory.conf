# Fleet node memory budget for systemd-oomd.
#
# ONE source for every fleet node that carries the budget. Nodes 88 and 44
# install THIS FILE VERBATIM as
#   ~/.config/systemd/user/agent-herder-fleet.service.d/30-memory.conf
# Same bytes, same values, same format for both nodes; a per-node copy of this
# file would be a second truth, so do not fork it.
#
# L44 (2026-10-24): the previous budget (MemoryHigh=384M, MemoryMax=768M) was
# below the measured working set of the node (memory.current peaked at
# 433020928 B). The unit therefore throttled against its own memory.high:
# cgroup memory.events high counter grew 15138 -> 39807 in two minutes. That
# reclaim activity inside scope user@1000.service is what systemd-oomd used as
# a kill trigger, and the unit was killed with SIGKILL 9 (code=killed,
# status=9/KILL, Failed with result signal) four times in one day.
#
# A finite MemoryHigh also makes the unit the best-scoring victim for
# systemd-oomd inside the scope (score = usage / memory.high), because every
# other unit in that scope has memory.high=infinity.
#
# Hosts, measured 2026-10-24:
#   88: ~83 GiB available, swap 0 - the raised bound is safe there.
#   44: MemTotal 131869436 kB, MemAvailable 105110248 kB (~100.2 GiB),
#       swap 0 - the raised bound is safe there as well. Before the change node
#       44 ran with memory.high=384M and memory.current=247750656 B, that is
#       61.5 % of the old high and only ~147 MiB of headroom.
#
# The unit template deploy/fleet/linux-node.service carries the same budget, so
# a reinstall of the unit keeps the budget even without this drop-in.
[Service]
MemoryHigh=1G
MemoryMax=2G
