[Service]
# Server-100 Desktop/SSH clients and Herder share one managed Codex daemon.
# Its endpoint speaks WebSocket over Unix; plain JSONL through proxy is invalid.
Environment=CODEX_APP_SERVER_SOCKET=%h/.codex/app-server-control/app-server-control.sock

# Measured on 2026-10-05: a 16384-token reservation returned overloaded_error;
# 8192/4096-token probes succeeded; the live 8192-token batch still timed out.
# Use eight-session chunks at 4096 and preserve shared provider capacity.
Environment=AGENT_HERDER_UNFINISHED_BATCH_MAX_TOKENS=4096
Environment=AGENT_HERDER_UNFINISHED_BATCH_CONCURRENCY=1
